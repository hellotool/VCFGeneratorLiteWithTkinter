name: "添加电话号码格式"
description: 提交新的国家/地区电话号码格式添加请求。
title: "[添加电话格式]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢您帮助完善电话号码格式覆盖！请提供以下关于国家/地区的信息。
  - type: input
    id: country-name
    attributes:
      label: 国家/地区名称
      description: 国家或地区的官方名称（例如："中国"、"美国"）
      placeholder: "例如：中国"
    validations:
      required: true
  - type: input
    id: iso-code
    attributes:
      label: ISO 3166-1 二位地区代码
      description: ISO 3166-1 中定义的两字母国家代码
      placeholder: "例如：CN"
    validations:
      required: true
  - type: input
    id: calling-code
    attributes:
      label: 国际区号
      description: 国际拨号代码（例如：中国的 "+86"）
      placeholder: "例如：+86"
    validations:
      required: true
  - type: textarea
    id: mobile-rules
    attributes:
      label: 手机号规则描述
      description: |
        描述手机号码的规则，包括：
        - 号码长度（总位数）
        - 常见前缀
        - 典型格式（带分隔符）
    validations:
      required: false
  - type: textarea
    id: landline-rules
    attributes:
      label: 固话规则描述
      description: |
        描述固定电话号码的规则，包括：
        - 号码长度（总位数）
        - 区号
        - 典型格式
    validations:
      required: false
  - type: textarea
    id: other-rules
    attributes:
      label: 其他规则描述
      description: 任何其他电话号码规则（例如：紧急号码、特殊服务）
    validations:
      required: false
  - type: input
    id: reference-links
    attributes:
      label: 参考资料链接
      description: 电话号码格式的官方文档或可靠来源链接
      placeholder: "例如：https://nac.miit.gov.cn/"
    validations:
      required: false
