[project]
name = "vcf-generator-lite"
version = "6.0.3"
description = "A lightweight VCF creation tool written in Python."
readme = "README_pypi.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Jesse205", email = "jesse205@qq.com" },
]
dependencies = [
  "ttk-text==0.3.4",
]
import-names = ["vcf_generator_lite"]

[project.urls]
Github = "https://github.com/hellotool/VCFGeneratorLiteWithTkinter"
Issues = "https://gitee.com/hellotool/VCFGeneratorLiteWithTkinter/issues/new/choose"
Repository = "https://gitee.com/hellotool/VCFGeneratorLiteWithTkinter"

[project.gui-scripts]
vcf-generator-lite = "vcf_generator_lite.__main__:main"

[project.optional-dependencies]
console = [
  "colorlog>=6.12.0",
]

[dependency-groups]
dev = [
  "colorlog>=6.12.0",
  { include-group = "basic" },
  { include-group = "build" },
  { include-group = "docs" },
  { include-group = "l10n" },
  { include-group = "lint" },
  { include-group = "test" },
]
basic = [
  "poethepoet>=0.49.0",
]
build = [
  "packaging>=26.3",
  "pyinstaller>=6.22.3",
  "requests>=2.34.2",
  { include-group = "basic" },
]
docs = [
  "jinja2>=3.1.6",
  "rumdl>=0.3.2",
  { include-group = "basic" },
]
l10n = [
  "babel>=2.18.0",
  { include-group = "basic" },
]
lint = [
  "pyright>=1.1.414",
  "ruff>=0.17.4",
  "tombi>=1.11.1",
  { include-group = "basic" },
]
test = [
  "pytest>=9.2.0",
  { include-group = "basic" },
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["*.po", "*.pot"]
