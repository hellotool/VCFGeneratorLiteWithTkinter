name: Test

on:
  push:
    branches:
      - "release/**"
    paths:
      - "**.py"
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.12", "3.13", "3.14t"]
        exclude:
          - os: "windows-latest"
            python-version: "3.13"
          - os: "macos-latest"
            python-version: "3.13"
    env:
      UV_NO_DEFAULT_GROUPS: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # GUI 测试需要真实图形环境：按键事件只有在窗口已映射时才会派发。
      - name: Test with pytest
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v Xvfb >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }
            xvfb-run -a uv run --group test --group basic poe test
          else
            uv run --group test --group basic poe test
          fi
